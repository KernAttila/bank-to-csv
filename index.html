<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to CSV Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Text to CSV Converter</h1>
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider">
                            <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3zm0-2c.28 0 .5-.22.5-.5v-3c0-.28-.22-.5-.5-.5s-.5.22-.5.5v3c0 .28.22.5.5.5zm0 13c-.28 0-.5.22-.5.5v3c0 .28.22.5.5.5s.5-.22.5-.5v-3c0-.28-.22-.5-.5-.5zm8.5-6.5c0-.28-.22-.5-.5-.5h-3c-.28 0-.5.22-.5.5s.22.5.5.5h3c.28 0 .5-.22.5-.5zM6.5 12c0-.28-.22-.5-.5-.5h-3c-.28 0-.5.22-.5.5s.22.5.5.5h3c.28 0 .5-.22.5-.5z"/></svg>
                            <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12.1,22c-0.3,0-0.6,0-0.9,0c-5.5-0.5-9.5-5.4-9-10.9c0.4-4.8,4.2-8.6,9-9c0.4,0,0.8,0.2,1,0.5c0.2,0.3,0.2,0.8-0.1,1.1c-2,2.7-1.4,6.4,1.3,8.4c2.1,1.6,5,1.6,7.1,0c0.3-0.2,0.7-0.3,1.1-0.1c0.3,0.2,0.5,0.6,0.5,1c-0.2,2.7-1.5,5.1-3.6,6.8C16.6,21.2,14.4,22,12.1,22z M9.3,4.4c-2.9,1-5,3.6-5.2,6.8c-0.4,4.4,2.8,8.3,7.2,8.7c2.1,0.2,4.2-0.4,5.8-1.8c1.1-0.9,1.9-2.1,2.4-3.4c-2.5,0.9-5.3,0.5-7.5-1.1C9.2,11.4,8.1,7.7,9.3,4.4z"/></svg>
                        </div>
                    </label>
                </div>
            </div>
            <input type="file" id="fileInput" accept=".txt">
        </header>
        
        <div class="to-process">
            <div id="remainingText"></div>
        </div>
        <main>
            <div class="processing-section">
                <h3>Remaining Text to Process (<span id="lineCounter">0</span> lines)</h3>
                <div class="next-lines" id="nextLines"></div>
                <div class="current-line" id="currentLine"></div>
                
                <div class="token-controls">
                    <button data-case="lower">lowercase</button>
                    <button data-case="upper">UPPERCASE</button>
                    <button data-case="title">Title Case</button>
                    <button id="discardBtn">Discard Token</button>
                </div>
                
                <div class="action-fields">
                    <div class="field">
                        <label>Description:</label>
                        <input type="text" id="descriptionField">
                        <button class="grab-btn" data-field="descriptionField">Grab</button>
                    </div>
                    <div class="field">
                        <label>Amount:</label>
                        <input type="text" id="amountField">
                        <button class="grab-btn" data-field="amountField">Grab</button>
                    </div>
                    <div class="field">
                        <label>Tag:</label>
                        <div class="input-with-dropdown">
                            <input type="text" id="tagField" list="tagSuggestions">
                            <datalist id="tagSuggestions"></datalist>
                        </div>
                        <button class="grab-btn" data-field="tagField">Grab</button>
                    </div>
                    <div class="field">
                        <label>Payment:</label>
                        <div class="input-with-dropdown">
                            <input type="text" id="paymentField" list="paymentSuggestions">
                            <datalist id="paymentSuggestions"></datalist>
                        </div>
                        <button class="grab-btn" data-field="paymentField">Grab</button>
                    </div>
                    <div class="field">
                        <label>Date:</label>
                        <input type="text" id="dateField">
                        <button class="grab-btn" data-field="dateField">Grab</button>
                    </div>
                    <button id="validateBtn">Validate Entry</button>
                </div>
            </div>

            <div class="management-sections">
                <div class="payment-types">
                    <h3>Payment Types</h3>
                    <div class="add-payment">
                        <input type="text" id="newPaymentType" placeholder="New payment type">
                        <button id="addPaymentBtn">Add</button>
                    </div>
                    <div class="payment-table">
                        <table id="paymentTable">
                            <thead>
                                <tr>
                                    <th>Payment Type</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="replacements">
                    <h3>Tags</h3>
                    <div class="add-tag">
                        <input type="text" id="newTagType" placeholder="New tag">
                        <button id="addTagBtn">Add</button>
                    </div>
                    <div class="tag-table">
                        <table id="tagTable">
                            <thead>
                                <tr>
                                    <th>Tag</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="replacements">
                    <h3>Text Replacements</h3>
                    <div class="replacements-table">
                        <table id="replacementsTable">
                            <thead>
                                <tr>
                                    <th>Original</th>
                                    <th>Replacement</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <button id="clearReplacements">Clear Replacements</button>
                </div>
            </div>
        </main>

        <div class="processed-section">
            <h3>Processed Entries</h3>
            <div class="table-container">
                <table id="csvTable">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Tag</th>
                            <th>Payment</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="export-controls">
                <button id="downloadCsv">Download CSV</button>
                <button id="copyToClipboard">Copy to Clipboard</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
